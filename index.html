    /* ===================================================
       CHAT PAGE
       =================================================== */
    function ChatPage({ darkMode }) {
      const [avatarMode, setAvatarMode] = useState(false);
      const [messages, setMessages] = useState(DEFAULT_BOT_MESSAGES);
      const [inputVal, setInputVal] = useState('');
      const [isLoading, setIsLoading] = useState(false);
      const [currentSessionId, setCurrentSessionId] = useState(null);
      const chatEndRef = useRef(null);
      const inputRef = useRef(null);
      const msgIdRef = useRef(100);

      /* Init session */
      useEffect(() => {
        (async () => {
          try {
            const res = await fetch(API + '/sessions', { method: 'POST' });
            const data = await res.json();
            setCurrentSessionId(data.id);
          } catch { /* backend offline — demo mode */ }
        })();
      }, []);

      /* Auto-scroll */
      useEffect(() => {
        chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [messages]);

      /* Send message */
      const sendMessage = useCallback(async () => {
        const text = inputVal.trim();
        if (!text || isLoading) return;

        const uid = msgIdRef.current++;
        const bid = msgIdRef.current++;
        const userMsg = { id: uid, role: 'user', text };
        const botPlaceholder = { id: bid, role: 'bot', text: '', emotion: 'NEUTRAL', streaming: true };

        setMessages(prev => [...prev, userMsg, botPlaceholder]);
        setInputVal('');
        setIsLoading(true);

        if (!currentSessionId) {
          /* Demo mode */
          await new Promise(r => setTimeout(r, 700));
          setMessages(prev => prev.map(m =>
            m.id === bid
              ? { ...m, text: 'Backend offline \uD83D\uDE14 Jalankan app.py dulu ya! Tapi aku dengar kamu: "' + text + '"', streaming: false }
              : m
          ));
          setIsLoading(false);
          return;
        }

        try {
          const res = await fetch(API + '/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ session_id: currentSessionId, message: text }),
          });
          const reader = res.body.getReader();
          const decoder = new TextDecoder();
          let buffer = '';
          let fullText = '';
          let emotion = 'NEUTRAL';

          while (true) {
            const { value, done } = await reader.read();
            if (done) break;
            buffer += decoder.decode(value, { stream: true });
            const lines = buffer.split('\n\n');
            buffer = lines.pop();
            for (const line of lines) {
              if (!line.startsWith('data: ')) continue;
              const payload = line.slice(6);
              if (payload === '[DONE]') continue;
              const data = JSON.parse(payload);
              if (data.emotion) {
                emotion = data.emotion;
                setMessages(prev => prev.map(m => m.id === bid ? { ...m, emotion } : m));
              } else if (data.token) {
                fullText += data.token;
                setMessages(prev => prev.map(m => m.id === bid ? { ...m, text: fullText } : m));
              } else if (data.error) {
                fullText = data.error;
                setMessages(prev => prev.map(m => m.id === bid ? { ...m, text: fullText } : m));
              }
            }
          }
          setMessages(prev => prev.map(m => m.id === bid ? { ...m, streaming: false } : m));
        } catch {
          setMessages(prev => prev.map(m =>
            m.id === bid ? { ...m, text: 'Gagal konek ke server. Pastikan app.py berjalan!', streaming: false } : m
          ));
        } finally {
          setIsLoading(false);
          inputRef.current?.focus();
        }
      }, [inputVal, isLoading, currentSessionId]);

      const handleKey = (e) => {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
      };

      /* EDIT: Ubah Warna Background & Theme Accent di sini (chat theme) */
      const chatBg = darkMode ? '#0b0f19' : '#f0fdf4';
      const inputBg = darkMode ? 'rgba(26,34,56,0.85)' : 'rgba(255,255,255,0.75)';
      const inputBdr = darkMode ? 'rgba(255,255,255,0.1)' : '#e5e7eb';
      const inputTxt = darkMode ? '#ffffff' : '#111827';
      const botBubBg = darkMode
        ? 'rgba(26,34,56,0.9)'
        : 'rgba(255,255,255,0.8)';
      const botBubTxt = darkMode ? 'rgba(255,255,255,0.88)' : '#111827';
      const botBubBdr = darkMode ? 'rgba(255,255,255,0.08)' : '#e5e7eb';

      return (
        <div className="flex flex-col h-screen pt-14 page-enter transition-all duration-300" style={{ background: chatBg }}>
          <AmbientBlobs />

          {/* Control bar */}
          <div className="relative z-10 flex items-center justify-between px-6 py-3 glass" style={{ borderBottom: '1px solid rgba(255,255,255,0.08)' }}>
            <div className="flex items-center gap-2">
              <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse" />
              <span className="text-xs font-semibold text-white/60">
                {avatarMode ? '\uD83C\uDFAD Avatar Mode' : '\uD83D\uDCAC Chat Teks'}
              </span>
            </div>
            <Toggle on={avatarMode} onChange={setAvatarMode} label="Avatar Mode" />
          </div>

          {/* Chat body */}
          <div className="relative z-10 flex-1 overflow-hidden">

            {/* AVATAR MODE */}
            {avatarMode ? (
              /* EDIT: Ganti Gambar / Asset Avatar di sini (background avatar mode) */
              <div className="avatar-bg absolute inset-0 flex items-end">
                <div className="absolute inset-0" style={{ background: 'rgba(11,15,25,0.45)' }} />

                {/* Avatar image */}
                {/* EDIT: Ganti Gambar / Asset Avatar di sini (fullbody avatar mode) */}
                <div className="relative z-10 flex-none" style={{ marginLeft: '5%', marginBottom: '-4px' }}>
                  <img
                    src="/assets/firefly_fullbody.png"
                    alt="Firefly"
                    className="h-5/6 w-auto object-cover object-top drop-shadow-2xl"
                    style={{ maxWidth: '300px', maxHeight: '75vh' }}
                    onError={e => { e.target.style.display = 'none'; }}
                  />
                </div>

                {/* Bubble overlay */}
                <div className="relative z-10 flex-1 flex flex-col items-end gap-3 p-6 overflow-y-auto" style={{ maxHeight: '72vh' }}>
                  {messages.slice(-5).map(msg => (
                    <div key={msg.id} className="max-w-xs lg:max-w-sm animate-fade-in">
                      {msg.role === 'user' ? (
                        <div className="bg-user-bubble bubble-user px-4 py-3 text-sm text-white font-medium shadow-glow">
                          {msg.text}
                        </div>
                      ) : (
                        <div className="glass-strong bubble-bot px-5 py-3 text-sm text-white/90 font-medium shadow-glass">
                          {msg.streaming
                            ? <span>{msg.text}<span className="inline-block w-0.5 h-4 bg-white/60 ml-0.5 animate-pulse" /></span>
                            : msg.text}
                        </div>
                      )}
                    </div>
                  ))}
                  <div ref={chatEndRef} />
                </div>
              </div>
            ) : (
              /* TEXT-ONLY MODE */
              <div className="h-full overflow-y-auto px-4 py-6 space-y-4 relative z-10" style={{ paddingBottom: '10px' }}>
                {messages.map(msg => (
                  <div
                    key={msg.id}
                    className={"flex animate-fade-in " + (msg.role === 'user' ? 'justify-end' : 'justify-start')}
                  >
                    {/* Bot avatar icon */}
                    {msg.role === 'bot' && (
                      <div className="flex-none mr-2 mt-1">
                        {/* EDIT: Ganti Gambar / Asset Avatar di sini (mini avatar icon) */}
                        <div className="w-8 h-8 rounded-full overflow-hidden flex-none" style={{ border: '1px solid rgba(255,255,255,0.12)' }}>
                          <img
                            src={`/assets/firefly_fullbody.png?v=${Date.now()}`}
                            alt="Firefly"
                            className="w-full h-full object-cover object-top"
                            onError={e => { e.target.style.display = 'none'; }}
                          />
                        </div>
                      </div>
                    )}

                    <div className={"max-w-2/3 space-y-1 " + (msg.role === 'user' ? 'flex flex-col items-end' : '')} style={{ maxWidth: '68%' }}>
                      <div
                        className={"px-4 py-3 text-sm leading-relaxed font-medium " + (msg.role === 'user' ? 'bg-user-bubble bubble-user text-white shadow-glow' : 'bubble-bot')}
                        style={msg.role === 'bot' ? { background: botBubBg, color: botBubTxt, border: '1px solid ' + botBubBdr } : {}}
                      >
                        {msg.streaming
                          ? <span>{msg.text}<span className="inline-block w-0.5 h-4 bg-current ml-0.5 animate-pulse opacity-70" /></span>
                          : msg.text}
                      </div>
                      {/* Emotion dot */}
                      {msg.role === 'bot' && !msg.streaming && (
                        <div className="flex items-center gap-1.5 pl-1">
                          <div className={"w-2 h-2 rounded-full dot-" + (msg.emotion || 'NEUTRAL')} />
                          <span className="text-xs text-white/30">{msg.emotion || 'NEUTRAL'}</span>
                        </div>
                      )}
                    </div>
                  </div>
                ))}
                <div ref={chatEndRef} />
              </div>
            )}
          </div>

          {/* Floating input bar */}
          <div className="relative z-20 px-4 pb-5 pt-2" style={{ backdropFilter: 'blur(20px)', background: darkMode ? 'rgba(11,15,25,0.85)' : 'rgba(240,253,244,0.85)' }}>
            <div
              className="flex items-center gap-3 rounded-2xl px-4 py-2 shadow-glass"
              style={{ background: inputBg, border: '1px solid ' + inputBdr }}
            >
              {/* Attachment icon */}
              <button id="btn-attachment" className="text-white/30 hover:text-white/60 transition-colors flex-none" title="Lampirkan file">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className="w-5 h-5">
                  <path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66L9.41 17.41a2 2 0 01-2.83-2.83l8.49-8.48" />
                </svg>
              </button>

              {/* Text input */}
              <input
                ref={inputRef}
                id="chat-text-input"
                type="text"
                value={inputVal}
                onChange={e => setInputVal(e.target.value)}
                onKeyDown={handleKey}
                placeholder="Masukan teks......"
                disabled={isLoading}
                autoComplete="off"
                className="flex-1 bg-transparent text-sm py-2 chat-input"
                style={{ color: inputTxt }}
              />

              {/* Send button */}
              <button
                id="btn-send"
                onClick={sendMessage}
                disabled={isLoading || !inputVal.trim()}
                className="w-9 h-9 rounded-full bg-hero-gradient flex items-center justify-center flex-none shadow-glow hover:opacity-90 active:scale-90 transition-all duration-150 disabled:opacity-40 disabled:cursor-not-allowed"
                title="Kirim"
              >
                {isLoading ? (
                  <svg className="w-4 h-4 text-white spin" viewBox="0 0 24 24" fill="none">
                    <circle cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="3" strokeDasharray="31.4" strokeDashoffset="10" />
                  </svg>
                ) : (
                  <svg viewBox="0 0 24 24" fill="currentColor" className="w-4 h-4 text-white">
                    <path d="M2 21l21-9L2 3v7l15 2-15 2z" />
                  </svg>
                )}
              </button>
            </div>
          </div>
        </div>
      );
    }

    /* ===================================================
       GALLERY PAGE
       =================================================== */
    function GalleryPage() {
      const [selected, setSelected] = useState(null);

      return (
        <div className="relative min-h-screen pt-20 pb-10 overflow-y-auto page-enter">
          <AmbientBlobs />

          <div className="relative z-10 max-w-6xl mx-auto px-6 pt-8">
            {/* Header */}
            <div className="text-center mb-10">
              <h1 className="text-4xl font-black mb-3">
                <span className="gradient-text">Galeri</span>
                <span className="text-white/80"> Karakter</span>
              </h1>
              <p className="text-white/50 text-sm">Koleksi skin &amp; ekspresi Firefly &mdash; pilih mood favoritmu</p>
            </div>

            {/* Grid */}
            {/* EDIT: Ganti Gambar / Asset Avatar di sini (gallery card images) */}
            <div className="grid grid-cols-2 md:grid-cols-3 gap-5">
              {GALLERY_ITEMS.map(item => (
                <div
                  key={item.id}
                  id={"gallery-item-" + item.id}
                  onClick={() => setSelected(item.id === selected ? null : item.id)}
                  className={"gallery-card glass rounded-2xl overflow-hidden cursor-pointer transition-all duration-200 " + (selected === item.id ? 'shadow-glow' : '')}
                  style={{ border: selected === item.id ? '1px solid rgba(168,85,247,0.5)' : '1px solid rgba(255,255,255,0.08)' }}
                >
                  {/* Image */}
                  <div className={"relative bg-gradient-to-br " + item.color + " flex items-center justify-center overflow-hidden"} style={{ height: '200px' }}>
                    {/* EDIT: Ganti Gambar / Asset Avatar di sini (gallery card images) */}
                    <img
                      src={item.img}
                      alt={item.label}
                      className="h-full w-full object-cover object-top opacity-90"
                      onError={e => {
                        e.target.style.display = 'none';
                        const fb = e.target.parentNode.querySelector('.fb-emoji');
                        if (fb) fb.style.display = 'flex';
                      }}
                    />
                    {/* Fallback emoji */}
                    <div className="fb-emoji hidden absolute inset-0 items-center justify-center text-6xl">
                      {item.emoji}
                    </div>
                    {/* Emotion badge */}
                    <div className="absolute top-2 right-2">
                      <div className={"w-3 h-3 rounded-full dot-" + item.emotion} />
                    </div>
                    {/* Selected overlay */}
                    {selected === item.id && (
                      <div className="absolute inset-0 flex items-center justify-center" style={{ background: 'rgba(168,85,247,0.2)' }}>
                        <div className="w-10 h-10 rounded-full flex items-center justify-center text-white text-lg" style={{ background: 'rgba(168,85,247,0.8)' }}>
                          ✓
                        </div>
                      </div>
                    )}
                  </div>
                  {/* Label */}
                  <div className="p-4">
                    <p className="font-semibold text-white/90 text-sm">{item.label}</p>
                    <p className="text-white/40 text-xs mt-0.5">Emosi: {item.emotion}</p>
                  </div>
                </div>
              ))}
            </div>

            {/* Selection bar */}
            {selected && (
              <div className="mt-8 glass rounded-2xl p-5 flex items-center justify-between animate-slide-up">
                <div>
                  <p className="text-white/80 font-semibold text-sm">
                    {GALLERY_ITEMS.find(i => i.id === selected)?.label} dipilih
                  </p>
                  <p className="text-white/40 text-xs mt-0.5">Skin ini akan aktif di Avatar Mode</p>
                </div>
                <button
                  id="btn-apply-skin"
                  className="px-6 py-2 rounded-xl bg-hero-gradient text-white text-sm font-bold hover:opacity-90 active:scale-95 transition-all shadow-glow"
                >
                  Terapkan {'\u2736'}
                </button>
              </div>
            )}

            <p className="text-center text-white/20 text-xs mt-10">
              Lebih banyak karakter segera hadir &middot; FireflyAI v1.0
            </p>
          </div>
        </div>
      );
    }

    /* ===================================================
       ROOT APP
       =================================================== */
    function App() {
      /* EDIT: Ubah Warna Background & Theme Accent di sini (default state) */
      const [page, setPage] = useState('home');
      const [darkMode, setDarkMode] = useState(true);

      useEffect(() => {
        document.body.style.background = darkMode ? '#0b0f19' : '#f0fdf4';
      }, [darkMode]);

      return (
        <div className="h-full relative" style={{ background: darkMode ? '#0b0f19' : '#f0fdf4' }}>
          <Navbar
            page={page}
            setPage={setPage}
            darkMode={darkMode}
            setDarkMode={setDarkMode}
          />
          {page === 'home' && <HomePage goToChat={() => setPage('chat')} goToGallery={() => setPage('gallery')} />}
          {page === 'chat' && <ChatPage darkMode={darkMode} />}
          {page === 'gallery' && <GalleryPage />}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>

</html>
